apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: thumbnail-service-knative
  namespace: thumbnail-pipeline
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "2"
    spec:
      containers:
        - image: 192.168.49.2:5000/thumbnail-service:0.1.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MINIO_ENDPOINT
              value: "minio.thumbnail-pipeline.svc.cluster.local:9000"
            - name: MINIO_BUCKET
              value: "thumbnail-pipeline"
            - name: MINIO_SECURE
              value: "false"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD

apiVersion: apps/v1
kind: Deployment

metadata:
  name: thumbnail-service
  namespace: thumbnail-pipeline

spec:
  replicas: 1

  selector:
    matchLabels:
      app: thumbnail-service

  template:
    metadata:
      labels:
        app: thumbnail-service

    spec:
      containers:
        - name: thumbnail-service
          image: thumbnail-service:0.1.5
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          envFrom:
            - configMapRef:
                name: thumbnail-service-config
            - secretRef:
                name: thumbnail-service-secret

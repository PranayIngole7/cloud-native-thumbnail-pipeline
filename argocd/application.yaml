apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: thumbnail-pipeline
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/PranayIngole7/cloud-native-thumbnail-pipeline.git
    targetRevision: main
    path: helm/thumbnail-pipeline

  destination:
    server: https://kubernetes.default.svc
    namespace: thumbnail-pipeline

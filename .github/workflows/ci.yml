name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Python
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Verify dependencies
        run: |
          python -m pip list

      - name: Run tests
        working-directory: app
        run: |
          python -m pytest -q

      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -t thumbnail-service:${IMAGE_TAG} ./app

      - name: Validate Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          docker image inspect thumbnail-service:${IMAGE_TAG}

          docker run -d \
            --name thumbnail-service-ci-test \
            -p 8000:8000 \
            thumbnail-service:${IMAGE_TAG}

          sleep 10

          docker ps

          docker inspect \
            --format '{{.State.Health.Status}}' \
            thumbnail-service-ci-test

          test "$(docker inspect \
            --format '{{.State.Health.Status}}' \
            thumbnail-service-ci-test)" = "healthy"

          docker stop thumbnail-service-ci-test
          docker rm thumbnail-service-ci-test

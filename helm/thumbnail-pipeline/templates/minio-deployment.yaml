apiVersion: apps/v1
kind: Deployment

metadata:
  name: minio
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "thumbnail-pipeline.labels" . | nindent 4 }}

spec:
  replicas: 1

  selector:
    matchLabels:
      {{- include "thumbnail-pipeline.minioSelectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "thumbnail-pipeline.minioSelectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"

          ports:
            - name: api
              containerPort: 9000
              protocol: TCP

            - name: console
              containerPort: 9001
              protocol: TCP

          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER

            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD

          volumeMounts:
            - name: minio-data
              mountPath: /data

      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
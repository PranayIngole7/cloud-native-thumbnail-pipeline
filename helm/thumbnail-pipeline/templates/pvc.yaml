apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: minio-data
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "thumbnail-pipeline.labels" . | nindent 4 }}

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: {{ .Values.minio.storage.size }}
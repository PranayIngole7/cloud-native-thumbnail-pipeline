apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: thumbnail-service-egress
  namespace: "{{ .Release.Namespace }}"

spec:
  podSelector:
    matchLabels:
      {{- include "thumbnail-pipeline.applicationSelectorLabels" . | nindent 6 }}

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: thumbnail-pipeline
              app.kubernetes.io/instance: "{{ .Release.Name }}"
      ports:
        - protocol: TCP
          port: 9000

    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: thumbnail-pipeline
              app.kubernetes.io/instance: "{{ .Release.Name }}"
      ports:
        - protocol: TCP
          port: 4317

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
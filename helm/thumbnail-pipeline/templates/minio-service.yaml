apiVersion: v1
kind: Service

metadata:
  name: minio
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "thumbnail-pipeline.labels" . | nindent 4 }}

spec:
  type: ClusterIP

  selector:
    {{- include "thumbnail-pipeline.minioSelectorLabels" . | nindent 4 }}

  ports:
    - name: api
      port: {{ .Values.minio.service.apiPort }}
      targetPort: 9000
      protocol: TCP

    - name: console
      port: {{ .Values.minio.service.consolePort }}
      targetPort: 9001
      protocol: TCP
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret

metadata:
  name: thumbnail-service-secret
  namespace: "{{ .Release.Namespace }}"

type: Opaque

stringData:
  MINIO_ACCESS_KEY: "{{ .Values.secrets.minioRootUser }}"
  MINIO_SECRET_KEY: "{{ .Values.secrets.minioRootPassword }}"
{{- end }}
